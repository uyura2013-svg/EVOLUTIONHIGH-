name: EvolutionHigh Android build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y curl unzip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -j -o /tmp/godot-templates.tpz "templates/android_debug.apk" "templates/android_release.apk" -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"

      - name: Configure Android signing and SDK
        shell: bash
        run: |
          set -euxo pipefail
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -v -keystore "$HOME/.local/share/godot/keystores/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          EOF

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="/usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk --licenses </dev/null || true
          "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk "platforms;android-34" "build-tools;34.0.0"

      - name: Validate and export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          echo "=== Android SDK contents ==="
          ls -la /usr/lib/android-sdk || true
          find /usr/lib/android-sdk -maxdepth 3 -type d 2>/dev/null | head -80 || true
          command -v sdkmanager || true
          godot --headless --verbose --editor --path . --quit
          godot --headless --verbose --path . --export-debug "Android" build/EvolutionHigh.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionHigh-Android
          path: build/EvolutionHigh.apk
          if-no-files-found: error
